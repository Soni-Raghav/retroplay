<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #game { width:100%; height:100%; }
  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:#8b93b8; font:14px system-ui, sans-serif; pointer-events:none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">Loading emulator…</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var romId = q.get('id');
  var sys = q.get('sys') || 'nes';
  var name = q.get('name') || 'game';

  function fail(msg) {
    document.getElementById('boot').textContent = 'Failed: ' + msg;
  }

  function boot(blobUrl) {
    window.EJS_player = '#game';
    window.EJS_core = sys;
    window.EJS_gameUrl = blobUrl;
    window.EJS_gameName = name;
    window.EJS_pathtodata = 'data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#7c3aed';
    window.EJS_backgroundColor = '#000000';
    window.EJS_defaultOptions = { 'save-state-location': 'browser',
                                  'rewindEnabled': 'disabled' };
    window.EJS_Buttons = { playPause: true, restart: true, mute: true, settings: true,
                           fullscreen: true, saveState: true, loadState: true,
                           screenRecord: false, gamepad: true, cheat: false,
                           volume: true, saveSavFiles: true, loadSavFiles: true,
                           quickSave: true, quickLoad: true, screenshot: false,
                           cacheManager: false, exitEmulation: true };
    var s = document.createElement('script');
    s.src = 'data/loader.js';
    s.onerror = function () { fail('cannot load data/loader.js'); };
    document.body.appendChild(s);
    var wait = setInterval(function () {
      if (window.EJS_emulator && window.EJS_emulator.started) {
        clearInterval(wait);
        var b = document.getElementById('boot');
        if (b) b.remove();
        try {
          window.EJS_emulator.on('exit', function () {
            parent.postMessage({ t: 'rp-exit' }, '*');
          });
        } catch (e) {}
      }
    }, 300);
  }

  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('retroplay', 1);
      r.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('roms')) {
          var st = db.createObjectStore('roms', { keyPath: 'id' });
          st.createIndex('addedAt', 'addedAt');
        }
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }

  openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('roms', 'readonly');
      var rq = tx.objectStore('roms').get(romId);
      rq.onsuccess = function () { rq.result ? res(rq.result.blob) : rej('ROM not found in library'); };
      rq.onerror = function () { rej(rq.error); };
    });
  }).then(function (blob) {
    boot(URL.createObjectURL(blob));
  }).catch(function (e) { fail(String(e)); });
})();
</script>
</body>
</html>
