<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #game { width:100%; height:100%; }
  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:#8b93b8; font:14px system-ui, sans-serif; pointer-events:none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">Loading emulator…</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var romId = q.get('id');
  var sys = q.get('sys') || 'nes';
  var name = q.get('name') || 'game';

  /* RetroPlay keyboard policy: keyboard input may ONLY drive Player 1.
   * EJS's keyboard handler simulates every player bound to a pressed key,
   * so stray Player 2-4 keyboard bindings (e.g. set by accident in the
   * control-settings menu) make the host keyboard control the guest's
   * character. We strip those bindings from saved settings at every boot.
   * Legacy EJS arrow-key defaults for P1 are upgraded to the RetroPlay
   * WASD scheme: W/A/S/D move, J=B K=A U=Y I=X, Q=L E=R,
   * Shift=Select Enter=Start. Custom P1 layouts are respected. */
  var RP_KEYS = { 4: 87, 5: 83, 6: 65, 7: 68,   // up W, down S, left A, right D
                  0: 74, 8: 75, 1: 85, 9: 73,   // B J, A K, Y U, X I
                  10: 81, 11: 69, 2: 16, 3: 13 }; // L Q, R E, Select Shift, Start Enter

  /* ---- Top-bar auto-hide bridge ----
   * Every pointer release is reported to the parent app with its y position.
   * The parent reveals the EXIT/KEYS bar only for taps in the top strip, so
   * normal gameplay taps never interrupt. Also lets the parent know the
   * emulator was tapped at all (keeps the bar awake while menus are used). */
  document.addEventListener('pointerup', function (e) {
    try { parent.postMessage({ t: 'rp-tap', y: Math.round(e.clientY) }, '*'); } catch (err) {}
  }, true);

  function sanitizeStoredControls() {
    try {
      if (!window.localStorage) return;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('ejs-') !== 0 || k.slice(-9) !== '-settings' || k === 'ejs-settings') continue;
        var data;
        try { data = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
        if (!data || !data.controlSettings || typeof data.controlSettings !== 'object') continue;
        var cs = data.controlSettings, changed = false;
        [1, 2, 3].forEach(function (p) {
          var c = cs[p];
          if (!c) return;
          Object.keys(c).forEach(function (n) {
            if (c[n] && typeof c[n] === 'object' && c[n].value !== '' && c[n].value !== undefined) {
              c[n].value = '';
              changed = true;
            }
          });
        });
        var c0 = cs[0];
        if (c0 && c0[4] && c0[0] &&
            (c0[4].value === 38 || c0[4].value === 'up arrow') &&
            (c0[0].value === 88 || c0[0].value === 'x')) {
          for (var b in RP_KEYS) {
            if (!c0[b] || typeof c0[b] !== 'object') c0[b] = {};
            c0[b].value = RP_KEYS[b];
          }
          changed = true;
        }
        if (changed) localStorage.setItem(k, JSON.stringify(data));
      }
    } catch (e) {}
  }
  sanitizeStoredControls();

  function fail(msg) {
    document.getElementById('boot').textContent = 'Failed: ' + msg;
  }

  function boot(blobUrl) {
    window.EJS_player = '#game';
    window.EJS_core = sys;
    window.EJS_gameUrl = blobUrl;
    window.EJS_gameName = name;
    window.EJS_pathtodata = 'data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#7c3aed';
    window.EJS_backgroundColor = '#000000';
    window.EJS_defaultOptions = { 'save-state-location': 'browser',
                                  'rewindEnabled': 'disabled' };
    /* EJS's own control-settings menu is DISABLED: its Player 2-4 tabs let a
     * user bind keyboard to the guest's slot (the original "his character
     * moves with my keys" bug) and RetroPlay now ships its own remap UI for
     * the host (RP_applyKeys + the KEYS panel in the parent app).
     * EJS's fullscreen is also DISABLED: it fullscreens an element INSIDE this
     * iframe, which hides the app's EXIT/KEYS bar and multiplayer button.
     * RetroPlay fullscreens the whole #gameScreen shell instead (FULL button). */
    window.EJS_Buttons = { playPause: true, restart: true, mute: true, settings: true,
                           fullscreen: false, saveState: true, loadState: true,
                           screenRecord: false, gamepad: false, cheat: false,
                           volume: true, saveSavFiles: true, loadSavFiles: true,
                           quickSave: true, quickLoad: true, screenshot: false,
                           cacheManager: false, exitEmulation: true };
    var s = document.createElement('script');
    s.src = 'data/loader.js';
    s.onerror = function () { fail('cannot load data/loader.js'); };
    document.body.appendChild(s);
    var wait = setInterval(function () {
      if (window.EJS_emulator && window.EJS_emulator.started) {
        clearInterval(wait);
        var b = document.getElementById('boot');
        if (b) b.remove();
        try {
          window.EJS_emulator.on('exit', function () {
            parent.postMessage({ t: 'rp-exit' }, '*');
          });
        } catch (e) {}
        try { enforceKeyboardPolicy(); } catch (e) {}
      }
    }, 300);

    /* Runtime guarantee on top of the storage sanitizer: Player 2-4 keep no
     * keyboard bindings for this session, and a factory-fresh install gets
     * the WASD scheme immediately (before any settings file exists).
     * Skipped when the host has configured keys via the app's KEYS panel
     * (rp-host-keys marker) — their custom layout always wins. */
    function enforceKeyboardPolicy() {
      var emu = window.EJS_emulator;
      if (!emu || !emu.controls) return;
      [1, 2, 3].forEach(function (p) {
        var c = emu.controls[p];
        if (!c) return;
        Object.keys(c).forEach(function (n) {
          if (c[n] && typeof c[n] === 'object') c[n].value = '';
        });
      });
      var userSet = false;
      try { userSet = localStorage.getItem('rp-host-keys') === '1'; } catch (e) {}
      if (!userSet) {
        var c0 = emu.controls[0] = emu.controls[0] || {};
        var up = c0[4] ? c0[4].value : undefined;
        if (up === undefined || up === '' || up === 38 || up === 'up arrow') {
          for (var b in RP_KEYS) {
            if (!c0[b] || typeof c0[b] !== 'object') c0[b] = {};
            c0[b].value = RP_KEYS[b];
          }
        }
        if (emu.saveSettings) emu.saveSettings();
      }
    }

    /* ---- Host remap bridge (called by the parent app, same origin) ----
     * map = { libretroBtn: keyCode | 'Mouse:N' | '' }. Applies to Player 1
     * only (keyboard policy: keyboard/mouse can never drive Player 2-4),
     * persists via EJS, and wires mouse buttons onto the canvas. EJS reads
     * this.controls live on every keydown, so changes are instant. */
    var hostMouse = { unbind: null };
    window.RP_applyKeys = function (map) {
      var emu = window.EJS_emulator;
      if (!emu || !emu.controls || !map) return false;
      try {
        var c0 = emu.controls[0] = emu.controls[0] || {};
        var mouseBinds = {};
        for (var k in map) {
          var b = Number(k), v = map[k];
          if (!c0[b] || typeof c0[b] !== 'object') c0[b] = {};
          if (typeof v === 'string' && v.indexOf('Mouse:') === 0) {
            c0[b].value = '';
            var mb = Number(v.slice(6));
            if (mb >= 0 && mb <= 2) mouseBinds[mb] = b;
          } else {
            c0[b].value = (v === '' || v === undefined || v === null) ? '' : Number(v);
          }
        }
        try { localStorage.setItem('rp-host-keys', '1'); } catch (e) {}
        if (emu.saveSettings) emu.saveSettings();
        setupHostMouse(emu, mouseBinds);
        return true;
      } catch (e) { return false; }
    };

    function setupHostMouse(emu, binds) {
      if (hostMouse.unbind) { try { hostMouse.unbind(); } catch (e) {} hostMouse.unbind = null; }
      var n = 0; for (var x in binds) n++;
      if (!n || !emu.canvas || !emu.gameManager) return;
      var down = function (e) {
        var b = binds[e.button];
        if (b === undefined) return;
        e.preventDefault();
        try { emu.gameManager.simulateInput(0, b, b >= 16 ? 0x7fff : 1); } catch (err) {}
      };
      var up = function (e) {
        var b = binds[e.button];
        if (b === undefined) return;
        try { emu.gameManager.simulateInput(0, b, 0); } catch (err) {}
      };
      var cm = function (e) { if (binds[2] !== undefined) e.preventDefault(); };
      emu.canvas.addEventListener('mousedown', down);
      window.addEventListener('mouseup', up);
      emu.canvas.addEventListener('contextmenu', cm);
      hostMouse.unbind = function () {
        emu.canvas.removeEventListener('mousedown', down);
        window.removeEventListener('mouseup', up);
        emu.canvas.removeEventListener('contextmenu', cm);
      };
    }
  }

  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('retroplay', 1);
      r.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('roms')) {
          var st = db.createObjectStore('roms', { keyPath: 'id' });
          st.createIndex('addedAt', 'addedAt');
        }
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }

  openDB().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('roms', 'readonly');
      var rq = tx.objectStore('roms').get(romId);
      rq.onsuccess = function () { rq.result ? res(rq.result.blob) : rej('ROM not found in library'); };
      rq.onerror = function () { rej(rq.error); };
    });
  }).then(function (blob) {
    boot(URL.createObjectURL(blob));
  }).catch(function (e) { fail(String(e)); });
})();
</script>
</body>
</html>
